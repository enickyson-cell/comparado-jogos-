<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Comparador de Jogos{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>🎮 Comparador de Preços de Jogos</h1>

        <nav>
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('cadastrar') }}">Adicionar jogo</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>

</html>
